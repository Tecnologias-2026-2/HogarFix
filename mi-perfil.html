<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi perfil | HogarFix</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" type="module"></script>
  </head>
  <body class="search-page">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="app.html#inicio"
          ><img src="assets/logo.png" alt="" width="36" height="36" /><span
            ><strong>HOGARFIX</strong><small>Calidad en cada arreglo</small></span
          ></a
        ><button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="client-nav"
          aria-label="Abrir menú"
        >
          ☰
        </button>
        <nav id="client-nav" class="primary-nav client-nav" aria-label="Navegación del cliente">
          <a href="app.html#inicio">Inicio</a><a href="buscar.html">Buscar</a
          ><a href="solicitudes.html">Mis Solicitudes</a><a href="chat.html">Chat</a
          ><a href="mi-perfil.html" aria-current="page">Mi Perfil</a>
        </nav>
        <div class="nav-actions client-account">
          <span class="client-avatar"><img src="assets/figma-search-user.svg" alt="" /></span
          ><span class="client-name" id="app-user-name">Cliente</span
          ><button class="button button-small logout-button" id="logout-button" type="button">
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>
    <main class="flow-main container" id="contenido">
      <a class="flow-back" href="app.html">← Inicio</a>
      <p class="eyebrow">Tu cuenta</p>
      <h1 class="flow-title">Mi perfil</h1>
      <form id="client-profile-form" class="flow-panel profile-form" novalidate aria-busy="true">
        <div class="profile-photo-row">
          <img
            class="profile-photo"
            src="assets/figma-search-user.svg"
            alt="Foto de perfil"
            data-photo-preview
            width="96"
            height="96"
          />
          <div>
            <p class="profile-photo-name" data-profile-fullname>Cargando…</p>
            <div class="photo-actions">
              <label class="button button-small button-outline-blue photo-upload"
                >Cambiar foto<input
                  type="file"
                  name="photoFile"
                  accept="image/png,image/jpeg,image/webp"
                  hidden
              /></label>
              <button
                class="button button-small button-outline-blue"
                type="button"
                data-photo-remove
              >
                Quitar foto
              </button>
            </div>
            <small class="muted-copy">JPG, PNG o WebP de hasta 5 MB.</small>
          </div>
        </div>

        <h2>Datos personales</h2>
        <div class="form-row">
          <label
            >Nombre<input name="firstName" autocomplete="given-name" maxlength="40" required
          /></label>
          <label
            >Apellido<input name="lastName" autocomplete="family-name" maxlength="40" required
          /></label>
        </div>
        <div class="form-row">
          <label
            >Correo electrónico<input name="email" type="email" readonly aria-readonly="true"
          /></label>
          <label
            >Teléfono<input
              name="phone"
              type="tel"
              autocomplete="tel"
              placeholder="+57 300 000 0000"
              maxlength="20"
          /></label>
        </div>
        <div class="form-row">
          <label
            >Ciudad<input
              name="city"
              autocomplete="address-level2"
              placeholder="Bogotá"
              maxlength="40"
          /></label>
          <label
            >Dirección principal<input
              name="address"
              autocomplete="street-address"
              placeholder="Calle 45 #28-10, Apto 301"
              maxlength="120"
          /></label>
        </div>
        <label
          >Sobre mí<textarea
            name="bio"
            rows="3"
            maxlength="300"
            placeholder="Cuéntales a los profesionales algo útil sobre ti o tu hogar (opcional)."
          ></textarea>
        </label>
        <label
          >Método de pago preferido
          <select name="preferredPayment">
            <option value="">Sin preferencia</option>
          </select>
        </label>

        <div class="form-actions">
          <button class="button" type="submit">Guardar cambios</button>
          <button class="button button-outline-blue" type="button" data-profile-cancel>
            Cancelar
          </button>
        </div>
        <p class="form-feedback" id="profile-message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© <span id="year"></span> HogarFix. Todos los derechos reservados.</span
          ><a href="buscar.html">Volver a buscar profesionales</a>
        </div>
      </div>
    </footer>
  </body>
</html>
