<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis solicitudes | HogarFix</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" type="module"></script>
  </head>
  <body class="search-page">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="app.html#inicio"
          ><img src="assets/logo.png" alt="" width="36" height="36" /><span
            ><strong>HOGARFIX</strong><small>Calidad en cada arreglo</small></span
          ></a
        ><button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="client-nav"
          aria-label="Abrir menú"
        >
          ☰
        </button>
        <nav id="client-nav" class="primary-nav client-nav" aria-label="Navegación del cliente">
          <a href="app.html#inicio">Inicio</a><a href="buscar.html">Buscar</a
          ><a href="solicitudes.html">Mis Solicitudes</a><a href="chat.html">Chat</a
          ><a href="mi-perfil-cliente.html">Mi Perfil</a>
        </nav>
        <div class="nav-actions client-account">
          <span class="client-avatar"><img src="assets/figma-search-user.svg" alt="" /></span
          ><span class="client-name" id="app-user-name">Cliente</span
          ><button class="button button-small logout-button" id="logout-button" type="button">
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>
    <main class="flow-main container">
      <p class="eyebrow">Tu actividad</p>
      <h1 class="flow-title">Mis solicitudes</h1>
      <p class="muted-copy">Consulta el estado y los detalles de tus servicios.</p>
      <div class="request-filters" role="group" aria-label="Filtrar por estado">
        <button type="button" data-request-filter="Todas" aria-pressed="true">Todas</button>
        <button type="button" data-request-filter="Pendiente" aria-pressed="false">
          Pendientes
        </button>
        <button type="button" data-request-filter="Aceptada" aria-pressed="false">
          Por confirmar
        </button>
        <button type="button" data-request-filter="Confirmada" aria-pressed="false">
          Confirmadas
        </button>
        <button type="button" data-request-filter="En proceso" aria-pressed="false">
          En proceso
        </button>
        <button type="button" data-request-filter="Completada" aria-pressed="false">
          Completadas
        </button>
        <button type="button" data-request-filter="Cancelada" aria-pressed="false">
          Canceladas
        </button>
      </div>
      <form class="date-filters" id="date-filters" aria-label="Filtrar por fecha del servicio">
        <label>Desde <input type="date" name="from" /></label>
        <label>Hasta <input type="date" name="to" /></label>
        <label
          >Ordenar
          <select name="order">
            <option value="desc">Más recientes primero</option>
            <option value="asc">Más antiguas primero</option>
          </select>
        </label>
        <button class="button button-small button-outline-blue" type="reset">Limpiar</button>
      </form>
      <p class="request-summary-line">
        <span id="request-count" aria-live="polite"></span>
        <span id="request-updated" class="muted-copy"></span>
      </p>
      <section id="request-list" class="request-list" aria-live="polite">
        <p class="load-state">Cargando tus solicitudes…</p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© <span id="year"></span> HogarFix. Todos los derechos reservados.</span
          ><a href="buscar.html">Volver a buscar profesionales</a>
        </div>
      </div>
    </footer>
  </body>
</html>
