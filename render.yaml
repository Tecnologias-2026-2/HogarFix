# Referencia de la configuración real del backend en Render.
# El servicio hogarfix-zbrm (https://hogarfix-zbrm.onrender.com) se creó a mano en el
# panel de Render con estos mismos valores; este archivo solo se aplica si se crea
# un Blueprint nuevo.
# Secret File (se sube en Render > Environment, nunca al repositorio):
#   firebase-admin.json -> clave de la cuenta de servicio de Firebase Admin.
# Render asigna PORT automáticamente; src/server.js lo lee de process.env.PORT.
services:
  - type: web
    name: hogarfix-zbrm
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: hogarfix-f9f56
      - key: CORS_ORIGINS
        value: https://tecnologias-2026-2.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
