services:
  - type: web
    name: hogarfix-api
    runtime: node
    plan: free
    region: ohio
    branch: Dev
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: hogarfix-f9f56
      - key: CORS_ORIGINS
        value: https://tecnologias-2026-2.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
